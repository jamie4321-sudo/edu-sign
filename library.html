<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23ff8a00%27/%3E%3Ctext x=%2732%27 y=%2741%27 text-anchor=%27middle%27 font-family=%27Arial Black,Arial,sans-serif%27 font-weight=%27900%27 font-size=%2722%27 fill=%27%2314160a%27%3EEDU%3C/text%3E%3C/svg%3E" />
  <title>가든 교육 자료 — SNACK & GARDEN EDU</title>
  <meta name="description" content="링키지랩 가든 교육 자료 — 사진과 설명으로 단계별로 봐요" />
  <link rel="preload" href="./fonts/KakaoBigSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/KakaoBigSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./css/styles.css?v=9" />
  <link rel="stylesheet" href="./css/library.css?v=6" />
  <script>
    (function () { try { var t = localStorage.getItem("edusign-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
</head>
<body>
  <!-- 크루용: 로그인 없이 교육 자료를 보기만 하는 페이지 (만들기·수정은 관리자 화면에서) -->
  <header class="pub-top"><b>SNACK<em>&amp;</em>GARDEN EDU</b><span>가든 교육</span></header>
  <main class="pub-wrap">
    <h1>가든 교육 자료</h1>
    <p class="sub">보고 싶은 자료를 누르면 크게 볼 수 있어요.</p>
    <div id="libList"></div>
  </main>

  <script src="./js/config.js?v=8"></script>
  <script src="./js/config.local.js?v=1"></script>
  <script src="./js/data.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="./js/store.js?v=8"></script>
  <script src="./js/library.js?v=6"></script>
  <script>
    EduLib.mountList(document.getElementById("libList"), { admin: false, part: "garden" }).then(function (items) {
      // 링크에 #자료id 가 붙어 있으면 바로 연다
      var id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
      var m = id && items.filter(function (x) { return x.id === id; })[0];
      if (m) EduLib.openReader(m, { admin: false });
    });
  </script>
</body>
</html>
