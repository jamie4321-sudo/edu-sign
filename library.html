<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script>/* 예전 github.io 주소로 들어오면 Cloudflare 주소로 옮김 (깃허브 아이디 노출 막기) */ if (/github\.io$/.test(location.hostname)) location.replace("https://linkagelab-edu.pages.dev" + location.pathname.replace(/^\/edu-sign/, "") + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 카톡 링크 미리보기 (동의서 전용 링크는 functions/sign.js 가 제목을 바꿈) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="링키지랩" />
  <meta property="og:title" content="링키지랩 교육 자료" />
  <meta property="og:description" content="연결의 시작 · 스낵앤가든 교육 자료" />
  <meta property="og:url" content="https://linkagelab-edu.pages.dev/library" />
  <meta property="og:image" content="https://linkagelab-edu.pages.dev/og.png?v=1" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="400" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23ff8a00%27/%3E%3Ctext x=%2732%27 y=%2741%27 text-anchor=%27middle%27 font-family=%27Arial Black,Arial,sans-serif%27 font-weight=%27900%27 font-size=%2722%27 fill=%27%2314160a%27%3EEDU%3C/text%3E%3C/svg%3E" />
  <title>가든 교육 자료 — SNACK & GARDEN EDU</title>
  <meta name="description" content="링키지랩 가든 교육 자료 — 사진과 설명으로 단계별로 봐요" />
  <link rel="preload" href="./fonts/KakaoBigSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/KakaoBigSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./css/styles.css?v=12" />
  <link rel="stylesheet" href="./css/library.css?v=10" />
  <script>
    (function () { try { var t = localStorage.getItem("edusign-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
</head>
<body>
  <!-- 크루용: 교육 서명처럼 내 이름으로 들어와서 교육 자료를 본다 (만들기·수정은 관리자 화면에서) -->
  <div id="app"></div>

  <script src="./js/config.js?v=9"></script>
  <script src="./js/config.local.js?v=1"></script>
  <script src="./js/data.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="./js/store.js?v=14"></script>
  <script src="./js/library.js?v=14"></script>
  <script src="./js/crew.js?v=4"></script>
  <script>
    (function () {
      var app = document.getElementById("app");
      EduCrew.gate(app, "가든 교육 자료", function (name, dept) {
        var safe = name.replace(/[&<>"']/g, "");
        app.innerHTML = '<header class="pub-top"><b>SNACK<em>&amp;</em>GARDEN EDU</b><span>가든 교육</span>'
          + '<div class="pub-who"><b>' + safe + '</b>님<button type="button" id="crewOut">이름 바꾸기</button></div></header>'
          + '<main class="pub-wrap"><h1>' + safe + '님, 안녕하세요</h1><p class="sub">보고 싶은 교육 자료를 누르면 크게 볼 수 있어요.</p><div id="libList"></div></main>';
        document.getElementById("crewOut").onclick = function () { if (confirm("다른 이름으로 들어갈까요?")) EduCrew.logout(); };
        var opts = { admin: false, part: "garden", crew: name, dept: dept || "", doneIds: {} };
        Store.listViews({ name: name }).then(function (vs) { vs.forEach(function (v) { if (v.doneAt) opts.doneIds[v.materialId] = 1; }); EduLib.refreshList(); }).catch(function () {});
        EduLib.mountList(document.getElementById("libList"), opts).then(function (items) {
          // 링크에 #자료id 가 붙어 있으면 바로 연다
          var id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
          var m = id && items.filter(function (x) { return x.id === id; })[0];
          if (m) EduLib.openReader(m, opts);
        });
      });
    })();
  </script>
</body>
</html>
